# Custom items. Each top-level key is the item id (a-z, 0-9, _).
#   base        vanilla item that carries the custom model (prefer items without right-click behaviour)
#   name        display name (MiniMessage)
#   lore        tooltip lines (MiniMessage)
#   texture     flat item texture, relative to content/textures (the model is generated)
#   model       alternative to texture: model JSON (Blockbench export), relative to content/models
#   use_models  models shown while right click is held, from the given use duration in ticks
#   display     handheld (default) or generated; only used together with texture
#   max_stack   1-99
#   tags        behaviour hooks implemented by the plugin
#               extinguisher  sprays, fill level, HUD (properties: capacity, range, spray, spray_sound)
#               hazard        can be reported in the hazard hunt (mission 2)
#               furniture     placeable object (display entity, planned)
#               sign          wall sign (display entity, planned)
#   properties  free-form values read by the plugin
#
# Models and textures are generated by tools/generate_assets.py.

# --- Feuerlöscher -----------------------------------------------------------------------------

feuerloescher_abc:
  base: minecraft:paper
  name: "<red>ABC-Pulverlöscher</red>"
  lore:
    - "<gray>Brandklassen:</gray> <white>A</white> <dark_gray>fest</dark_gray> · <white>B</white> <dark_gray>flüssig</dark_gray> · <white>C</white> <dark_gray>Gase</dark_gray>"
    - ""
    - "<yellow>Rechtsklick halten</yellow> <gray>zum Löschen</gray>"
    - "<gray>Mit dem Wind löschen, stoßweise sprühen.</gray>"
  model: item/feuerloescher_abc.json
  use_models:
    - { after: 0, model: item/feuerloescher_abc_draw.json }
    - { after: 4, model: item/feuerloescher_abc_aim.json }
  max_stack: 1
  tags: [extinguisher]
  properties:
    capacity: 100
    range: 6
