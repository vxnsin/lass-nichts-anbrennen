# Office of the online retailer "BrandNeu Versand GmbH" (mission 2): small office, meeting room, kitchenette
# and charging corner in the north, corridor with the emergency exit, open-plan office in the south.
# Ten hidden fire hazards, six things that are deliberately fine. Map format: see hub.yml.

