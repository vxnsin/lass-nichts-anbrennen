name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test and package the resource pack
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: lass-nichts-anbrennen
          path: |
            plugin/build/libs/*.jar
            packbuilder/build/pack/pack.zip
